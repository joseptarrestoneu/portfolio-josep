<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#FAFAFA;--ink:#111315;--grey:#5F6670;--line:#E4E6EA;--accent:#2D6CDF;--card:#FFFFFF}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.5}
  a{color:var(--accent)}
  header{position:relative;padding:28px 32px 8px;max-width:900px;margin:0 auto}
  .back{display:inline-block;margin-bottom:14px;font-size:12.5px;color:var(--grey);text-decoration:none}
  .back:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
  .tag{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--grey)}
  .tag i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
  h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(26px,3.4vw,40px);line-height:1.1;margin:10px 0 6px;letter-spacing:-.01em}
  header p{margin:0;color:var(--grey);max-width:60ch}
  .langs{position:absolute;right:32px;top:26px;display:flex;gap:4px}
  .langs button{font:600 11px Inter,sans-serif;letter-spacing:.04em;padding:4px 9px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--grey);cursor:pointer}
  .langs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .langs button:hover{border-color:var(--accent)}
  main{max-width:900px;margin:0 auto;padding:12px 32px 24px}
  .rel{position:relative;margin:28px 0 0;padding:0 0 0 26px;border-left:2px solid var(--line)}
  .rel::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--bg)}
  .rel__meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:13px;color:var(--grey)}
  .rel__v{font:700 12px 'Space Grotesk',sans-serif;letter-spacing:.04em;padding:3px 10px;border-radius:999px;background:var(--ink);color:#fff}
  .rel h2{font-family:'Space Grotesk',sans-serif;font-size:22px;line-height:1.2;margin:8px 0 8px;letter-spacing:-.01em}
  .rel ul{margin:0 0 14px;padding-left:20px}
  .rel li{margin:4px 0}
  .rel figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .rel figure img{display:block;width:100%;height:auto}
  .rel figcaption{padding:8px 14px;font-size:12.5px;color:var(--grey);border-top:1px solid var(--line)}
  .more{margin:28px 0 0;color:var(--grey);font-size:13.5px}
  .sitefoot{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:2rem;max-width:900px;margin:24px auto 0;padding:1.5rem 32px 32px;border-top:1px solid var(--line);font-size:.8rem;color:var(--ink)}
  .sitefoot p{margin:0}
  .sitefoot div{display:flex;gap:1.25rem}
  .sitefoot a{color:inherit;text-decoration:none}
  .sitefoot a:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
  .sitefoot>a:last-child{justify-self:end}
  @media (max-width:760px){header{padding:20px 16px 8px}.langs{right:16px;top:20px}main{padding:8px 16px 16px}.rel{padding-left:18px}.sitefoot{grid-template-columns:1fr;gap:.75rem;padding:1.25rem 16px 24px}.sitefoot>a:last-child{justify-self:start}}
</style>
</head>
<body>
<header>
  <div class="langs" role="group" data-i18n-aria="langAria" aria-label="Idioma">
    <button type="button" data-lang="ca" aria-pressed="true">CA</button><button type="button" data-lang="es" aria-pressed="false">ES</button><button type="button" data-lang="en" aria-pressed="false">EN</button>
  </div>
  <a class="back" href="/ultra/" data-i18n="back">← Els mapes</a><br>
  <span class="tag"><i></i><span data-i18n="tag">Novetats</span></span>
  <h1 data-i18n="h1">Què ha canviat als mapes</h1>
  <p data-i18n="intro">Una llista de versions. Cada diumenge apunto què ha canviat, amb la data i una captura.</p>
</header>

<main id="list" aria-live="polite"></main>

<footer class="sitefoot">
  <p>© <span id="year"></span> Josep Tarrés · <a href="/privadesa.html" data-i18n="privacy">Política de privadesa</a> · <a href="/" data-i18n="portfolio">Tornar al portfoli</a></p>
  <div>
    <a href="https://www.linkedin.com/in/josep-tarr%C3%A9s-toneu-63003040/" rel="noreferrer" data-goatcounter-click="novetats-social-linkedin">LinkedIn</a>
    <a href="https://www.instagram.com/joseptarres/" target="_blank" rel="noopener" data-goatcounter-click="novetats-social-instagram">Instagram</a>
  </div>
  <a href="#" id="totop" data-i18n="top">Tornar a dalt ↑</a>
</footer>

<script>
(function () {
  'use strict';
  /* Cada versió nova s'afegeix al PRINCIPI d'aquesta llista. */
  const ENTRIES = [
    {
      v: 'v0.1', date: '2026-11-25', img: 'v0.1-mapa-senders.png',
      ca: { t: 'Dos mapes, una sola adreça', items: [
        "<b>Mapa de l'ultraciclisme</b>: 110 proves, brevets i rutes de bikepacking d'Espanya.",
        "<b>Mapa de senders d'Espanya</b>, a partir d'OpenStreetMap: 286 GR, 133 vies verdes, 36 camins de Santiago i històrics, 7 senders europeus (entre ells tres EuroVelo) i 389 petits recorreguts (PR) de Catalunya i la Comunitat Valenciana.",
        "Les 43 comarques de Catalunya, com a capa opcional i com a filtre.",
        "Tots dos mapes, a la mateixa pàgina, <a href=\"/ultra/\">cadascun en una pestanya</a>." ],
        cap: "Mapa de senders d'Espanya, vista inicial." },
      es: { t: 'Dos mapas, una sola dirección', items: [
        '<b>Mapa del ultraciclismo</b>: 110 pruebas, brevets y rutas de bikepacking de España.',
        '<b>Mapa de senderos de España</b>, a partir de OpenStreetMap: 286 GR, 133 vías verdes, 36 caminos de Santiago e históricos, 7 senderos europeos (entre ellos tres EuroVelo) y 389 pequeños recorridos (PR) de Cataluña y la Comunitat Valenciana.',
        'Las 43 comarcas de Cataluña, como capa opcional y como filtro.',
        'Los dos mapas, en la misma página, <a href="/ultra/">cada uno en una pestaña</a>.' ],
        cap: 'Mapa de senderos de España, vista inicial.' },
      en: { t: 'Two maps, one address', items: [
        '<b>Ultracycling map</b>: 110 events, brevets and bikepacking routes across Spain.',
        '<b>Map of Spain’s trails</b>, built from OpenStreetMap: 286 GR, 133 greenways, 36 Camino de Santiago and historic routes, 7 European trails (three of them EuroVelo) and 389 short-distance trails (PR) in Catalonia and the Comunitat Valenciana.',
        'The 43 comarques (counties) of Catalonia, as an optional layer and as a filter.',
        'Both maps on the same page, <a href="/ultra/">each in its own tab</a>.' ],
        cap: 'Map of Spain’s trails, initial view.' },
    },
  ];
  const I18N = {
    ca: { langAria: 'Idioma', back: '← Els mapes', tag: 'Novetats', h1: 'Què ha canviat als mapes', intro: 'Una llista de versions. Cada diumenge apunto què ha canviat, amb la data i una captura.', privacy: 'Política de privadesa', portfolio: 'Tornar al portfoli', top: 'Tornar a dalt ↑', more: 'Aquí apareixerà cada nova versió.' },
    es: { langAria: 'Idioma', back: '← Los mapas', tag: 'Novedades', h1: 'Qué ha cambiado en los mapas', intro: 'Una lista de versiones. Cada domingo apunto qué ha cambiado, con la fecha y una captura.', privacy: 'Política de privacidad', portfolio: 'Volver al portfolio', top: 'Volver arriba ↑', more: 'Aquí aparecerá cada nueva versión.' },
    en: { langAria: 'Language', back: '← The maps', tag: 'What’s new', h1: 'What has changed in the maps', intro: 'A list of versions. Every Sunday I note what changed, with the date and a screenshot.', privacy: 'Privacy policy', portfolio: 'Back to the portfolio', top: 'Back to top ↑', more: 'Each new version will appear here.' },
  };
  const detect = () => { const n = (navigator.language || 'ca').toLowerCase(); return n.startsWith('ca') ? 'ca' : n.startsWith('es') ? 'es' : 'en'; };
  let lang = detect();
  try { const s = localStorage.getItem('mapes-lang'); if (I18N[s]) lang = s; } catch (e) { /* sense emmagatzematge */ }
  const fmt = (iso) => { try { return new Date(iso + 'T12:00:00').toLocaleDateString(lang === 'ca' ? 'ca-ES' : lang === 'es' ? 'es-ES' : 'en-GB', { day: 'numeric', month: 'long', year: 'numeric' }); } catch (e) { return iso; } };
  function render() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach((el) => { const v = I18N[lang][el.dataset.i18n]; if (v != null) el.textContent = v; });
    document.querySelectorAll('[data-i18n-aria]').forEach((el) => el.setAttribute('aria-label', I18N[lang][el.dataset.i18nAria]));
    document.querySelectorAll('.langs button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    document.getElementById('list').innerHTML = ENTRIES.map((e) => {
      const L = e[lang];
      return '<article class="rel" id="' + e.v + '"><div class="rel__meta"><span class="rel__v">' + e.v + '</span><time datetime="' + e.date + '">' + fmt(e.date) + '</time></div>' +
        '<h2>' + L.t + '</h2><ul>' + L.items.map((i) => '<li>' + i + '</li>').join('') + '</ul>' +
        '<figure><img src="' + e.img + '" width="1400" height="900" alt="' + L.cap.replace(/"/g, '&quot;') + '" loading="lazy"><figcaption>' + L.cap + '</figcaption></figure></article>';
    }).join('') + '<p class="more">' + I18N[lang].more + '</p>';
  }
  document.querySelectorAll('.langs button').forEach((b) => b.addEventListener('click', () => { lang = b.dataset.lang; try { localStorage.setItem('mapes-lang', lang); } catch (e) { /* sense emmagatzematge */ } render(); }));
  document.getElementById('totop').addEventListener('click', (ev) => { ev.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
  document.getElementById('year').textContent = new Date().getFullYear();
  render();
})();
</script>
</body>
</html>
