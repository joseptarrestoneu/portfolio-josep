<style>

  @media (max-width:900px){header{padding:20px 12px 8px}.langs{right:12px;top:20px}.tabs{padding:0 8px}.nl,.about{padding:0 12px}.sitefoot{grid-template-columns:1fr;gap:.75rem;padding:1.25rem 12px 24px}.sitefoot>a:last-child{justify-self:start}.tablist button{padding:9px 12px;font-size:13px}}
  @media (max-width:760px){.nl{padding:0 16px}.nl__in{grid-template-columns:1fr;padding:20px}.nl .row{flex-direction:column}}

<body>

        <input type="text" id="nl-hp" class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">

</footer>

<script>
(function () {
  'use strict';
  const I18N = {
    ca: { langAria: 'Idioma', tabsAria: 'Mapes', tag: 'Mapes', h1: 'Dos mapes, una sola adreça', intro: "Les ultres de ciclisme i els senders d'Espanya, a la mateixa pàgina. Tria la pestanya.", tabUltra: 'Ultraciclisme', tabSenders: "Senders d'Espanya", news: 'Novetats →', fUltra: "Mapa de l'ultraciclisme", fSenders: "Mapa de senders d'Espanya",
      nlK: 'Newsletter', nlT: 'Tecnologia i esport, cada diumenge', nlP: 'Un correu a la setmana amb el que vaig aprenent construint productes digitals i fent quilòmetres amb la bici. Amb baixa quan vulguis.', nlLbl: 'El teu correu electrònic', nlGo: "Apunta-m'hi", nlC: 'Accepto rebre la newsletter setmanal de Josep Tarrés. He llegit la', privacy: 'Política de privadesa', privacy2: 'Política de privadesa',
      ctaT: "Aquests mapes els he fet jo. Si vols una eina així per al teu club o empresa", ctaA: 'Parlem', portfolio: 'Tornar al portfoli', top: 'Tornar a dalt ↑',
      about: "Dades dels mapes: © col·laboradors d'OpenStreetMap (llicència ODbL) i fonts pròpies de cada mapa. Pantalla completa:", fullU: 'Ultraciclisme', fullS: "Senders d'Espanya" },
    es: { langAria: 'Idioma', tabsAria: 'Mapas', tag: 'Mapas', h1: 'Dos mapas, una sola dirección', intro: 'Las ultras de ciclismo y los senderos de España, en la misma página. Elige la pestaña.', tabUltra: 'Ultraciclismo', tabSenders: 'Senderos de España', news: 'Novedades →', fUltra: 'Mapa del ultraciclismo', fSenders: 'Mapa de senderos de España',
      nlK: 'Newsletter', nlT: 'Tecnología y deporte, cada domingo', nlP: 'Un correo a la semana con lo que voy aprendiendo construyendo productos digitales y haciendo kilómetros en bici. Con baja cuando quieras.', nlLbl: 'Tu correo electrónico', nlGo: 'Apúntame', nlC: 'Acepto recibir la newsletter semanal de Josep Tarrés. He leído la', privacy: 'Política de privacidad', privacy2: 'Política de privacidad',
      ctaT: 'Estos mapas los he hecho yo. Si quieres una herramienta así para tu club o empresa', ctaA: 'Hablemos', portfolio: 'Volver al portfolio', top: 'Volver arriba ↑',
      about: 'Datos de los mapas: © colaboradores de OpenStreetMap (licencia ODbL) y fuentes propias de cada mapa. Pantalla completa:', fullU: 'Ultraciclismo', fullS: 'Senderos de España' },
    en: { langAria: 'Language', tabsAria: 'Maps', tag: 'Maps', h1: 'Two maps, one address', intro: 'Cycling ultras and Spain’s hiking trails, on the same page. Pick a tab.', tabUltra: 'Ultracycling', tabSenders: 'Trails of Spain', news: 'What’s new →', fUltra: 'Ultracycling map', fSenders: 'Map of Spain’s trails',
      nlK: 'Newsletter', nlT: 'Tech and sport, every Sunday', nlP: 'One email a week with what I learn building digital products and riding my bike. Unsubscribe whenever you like.', nlLbl: 'Your email address', nlGo: 'Sign me up', nlC: 'I agree to receive Josep Tarrés’s weekly newsletter. I have read the', privacy: 'Privacy policy', privacy2: 'Privacy policy',
      ctaT: 'I built these maps. If you want a tool like this for your club or company', ctaA: "Let's talk", portfolio: 'Back to the portfolio', top: 'Back to top ↑',
      about: 'Map data: © OpenStreetMap contributors (ODbL licence) and each map’s own sources. Full screen:', fullU: 'Ultracycling', fullS: 'Trails of Spain' },
  };
  const NLX = {
    ca: { nlPh: 'el-teu@correu.cat', nlSend: 'Enviant…', nlOk: 'Gairebé! T’he enviat un correu: obre’l i confirma la subscripció.', email_invalid: 'Escriu una adreça de correu vàlida.', consent_required: 'Cal acceptar la newsletter i la política de privadesa.', mail_failed: 'No hem pogut enviar el correu de confirmació. Torna-ho a provar d’aquí a una estona.', weekly_disabled: 'La newsletter no està disponible ara mateix.', other: 'No ho hem pogut fer. Torna-ho a provar d’aquí a una estona.' },
    es: { nlPh: 'tu@correo.es', nlSend: 'Enviando…', nlOk: '¡Casi! Te he enviado un correo: ábrelo y confirma la suscripción.', email_invalid: 'Escribe una dirección de correo válida.', consent_required: 'Hay que aceptar la newsletter y la política de privacidad.', mail_failed: 'No hemos podido enviar el correo de confirmación. Vuelve a intentarlo en un rato.', weekly_disabled: 'La newsletter no está disponible ahora mismo.', other: 'No lo hemos podido hacer. Vuelve a intentarlo en un rato.' },
    en: { nlPh: 'you@email.com', nlSend: 'Sending…', nlOk: 'Almost there! I’ve sent you an email: open it and confirm your subscription.', email_invalid: 'Enter a valid email address.', consent_required: 'You need to accept the newsletter and the privacy policy.', mail_failed: 'We couldn’t send the confirmation email. Please try again in a moment.', weekly_disabled: 'The newsletter isn’t available right now.', other: 'We couldn’t do it. Please try again in a moment.' },
  };
  const TABS = ['ultraciclisme', 'senders'];
  const count = (path) => { try { if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path, event: true }); } catch (e) { /* sense seguiment */ } };

  /* ---------- idioma ---------- */
  const detect = () => { const n = (navigator.language || 'ca').toLowerCase(); return n.startsWith('ca') ? 'ca' : n.startsWith('es') ? 'es' : 'en'; };
  let lang = detect();
  try { const s = localStorage.getItem('mapes-lang'); if (I18N[s]) lang = s; } catch (e) { /* sense emmagatzematge */ }
  const tx = (k) => I18N[lang][k];

  function frames() { return TABS.map((t) => document.getElementById('f-' + t)); }
  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach((el) => { const v = I18N[lang][el.dataset.i18n]; if (v != null) el.textContent = v; });
    document.querySelectorAll('[data-i18n-aria]').forEach((el) => { el.setAttribute('aria-label', I18N[lang][el.dataset.i18nAria]); });
    document.querySelectorAll('.langs button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    frames().forEach((f) => { f.title = tx(f.dataset.titleKey); });
    const em = document.getElementById('nl-email'); if (em) em.placeholder = NLX[lang].nlPh;
    /* idioma als mapes ja carregats (mateix origen: simulem el clic al seu selector) */
    frames().forEach((f) => { try { const b = f.contentDocument && f.contentDocument.querySelector('.langs button[data-lang="' + lang + '"]'); if (b && b.getAttribute('aria-pressed') !== 'true') b.click(); } catch (e) { /* no accessible */ } });
  }

  /* ---------- pestanyes ---------- */
  const tabBtn = (t) => document.getElementById('tab-' + t);
  function sizeFrame(f) { /* mateix origen: l'alçada segueix el contingut del mapa */
    try {
      const doc = f.contentDocument; if (!doc || !doc.documentElement) return;
      const set = () => { const h = Math.ceil(doc.documentElement.scrollHeight); if (h > 200) f.style.height = h + 'px'; };
      set();
      if (f._ro) f._ro.disconnect();
      if (window.ResizeObserver) { f._ro = new ResizeObserver(set); f._ro.observe(doc.documentElement); if (doc.body) f._ro.observe(doc.body); }
    } catch (e) { /* si no és accessible, es queda l'alçada per defecte */ }
  }
  function load(t) {
    const f = document.getElementById('f-' + t); if (!f || f.getAttribute('src')) return;
    f.addEventListener('load', () => { sizeFrame(f); applyLang(); });
    f.setAttribute('src', f.dataset.src + '?embed=1&langs=0&in=ultra#lang=' + lang);
  }
  function show(t, fromUser) {
    if (!TABS.includes(t)) t = TABS[0];
    TABS.forEach((x) => {
      const on = x === t; const b = tabBtn(x);
      b.setAttribute('aria-selected', String(on)); b.tabIndex = on ? 0 : -1;
      document.getElementById('panel-' + x).hidden = !on;
    });
    load(t);
    if (fromUser) { count('ultra-pestanya-' + t); try { history.replaceState(null, '', location.pathname + location.search + '#' + t); } catch (e) { /* sense historial */ } }
  }
  document.querySelectorAll('.tablist [role="tab"]').forEach((b) => {
    b.addEventListener('click', () => show(b.dataset.tab, true));
    b.addEventListener('keydown', (ev) => {
      const i = TABS.indexOf(b.dataset.tab); let n = -1;
      if (ev.key === 'ArrowRight') n = (i + 1) % TABS.length; else if (ev.key === 'ArrowLeft') n = (i + TABS.length - 1) % TABS.length; else if (ev.key === 'Home') n = 0; else if (ev.key === 'End') n = TABS.length - 1;
      if (n >= 0) { ev.preventDefault(); show(TABS[n], true); tabBtn(TABS[n]).focus(); }
    });
  });
  window.addEventListener('hashchange', () => show(location.hash.slice(1), false));
  document.querySelectorAll('.langs button').forEach((b) => b.addEventListener('click', () => { lang = b.dataset.lang; try { localStorage.setItem('mapes-lang', lang); } catch (e) { /* sense emmagatzematge */ } applyLang(); }));
  document.getElementById('totop').addEventListener('click', (ev) => { ev.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
  document.getElementById('year').textContent = new Date().getFullYear();

  /* ---------- newsletter (mateix backend que el portfoli i els mapes) ---------- */
  (function () {
    const form = document.getElementById('nl-form'); if (!form) return;
    const api = form.dataset.api.replace(/\/$/, ''), msg = document.getElementById('nl-msg'), go = document.getElementById('nl-go'), em = document.getElementById('nl-email');
    const say = (s, kind) => { msg.textContent = s; msg.className = 'msg' + (kind ? ' ' + kind : ''); };
    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const email = em.value.trim(); const N = NLX[lang];
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return say(N.email_invalid, 'err');
      if (!document.getElementById('nl-consent').checked) return say(N.consent_required, 'err');
      go.disabled = true; say(N.nlSend);
      try {
        const r = await fetch(api + '/api/subscribe', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, consent: true, website: document.getElementById('nl-hp').value }) });
        const d = await r.json().catch(() => ({}));
        if (!r.ok || !d.ok) throw new Error(d.error || 'error');
        say(N.nlOk, 'ok'); form.reset(); count('ultra-newsletter-subscriu');
      } catch (e) { say(N[e.message] && e.message !== 'nlOk' && e.message !== 'nlPh' ? N[e.message] : N.other, 'err'); }
      go.disabled = false;
    });
  })();

  applyLang();
  show(location.hash.slice(1), false);
})();
</script>
